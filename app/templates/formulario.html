
<!DOCTYPE html>
<html>
<head>
    <title>Formulario - TechBol</title>
</head>
<body>

    <h1>TechBol</h1>

    <h2>{{ titulo }}</h2>

    <form method="POST">

        {% for campo in campos %}

        <label>{{ campo }}</label><br>

        <input
            type="{% if campo == 'precio' %}number{% elif campo == 'stock' %}number{% else %}text{% endif %}"
            step="0.01"
            name="{{ campo }}"
            value="{{ registro|attr(campo) if registro else '' }}"
            required
        >

        <br><br>

        {% endfor %}

        <button type="submit">Guardar</button>

    </form>

    <br>

    <a href="javascript:history.back()">Volver</a>

</body>
</html>
